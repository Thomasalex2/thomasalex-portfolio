[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Force correct MIME types for JavaScript assets
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000"

# Force correct MIME types for CSS assets
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "public, max-age=31536000"

# Force correct MIME types for other assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# WhatsApp/Facebook scrapers need a real JPEG, not a cached 12MB PNG
[[headers]]
  for = "/images/aerial/og-landscape.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/google03caf8141bccc0a2.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

# Handle SPA routing - but NOT for assets
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# Serve aerial-specific HTML (meta/OG tags) for crawlers and visitors
[[redirects]]
  from = "/google03caf8141bccc0a2.html"
  to = "/google03caf8141bccc0a2.html"
  status = 200

[[redirects]]
  from = "/aerial"
  to = "/aerial.html"
  status = 200

[[redirects]]
  from = "/aerial/"
  to = "/aerial.html"
  status = 200

# SPA fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
