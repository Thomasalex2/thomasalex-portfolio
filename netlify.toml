[build]
  base = "portfolio"
  command = "npm run build"
  publish = "dist"
  functions = "functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/google03caf8141bccc0a2.html"
  to = "/google03caf8141bccc0a2.html"
  status = 200

[[redirects]]
  from = "/aerial"
  to = "/aerial.html"
  status = 200

[[redirects]]
  from = "/aerial/"
  to = "/aerial.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
